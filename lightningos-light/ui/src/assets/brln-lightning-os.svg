    <linearGradient id="badgeFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff26b"/>
      <stop offset="50%" stop-color="#ffdc1f"/>
      <stop offset="100%" stop-color="#ffc400"/>
    </linearGradient>
    <filter id="badgeGlow" x="-30%" y="-50%" width="160%" height="220%">
